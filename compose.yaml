services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:3001/api
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      # Variables de prueba para Firebase Local
      - NUXT_PUBLIC_FIREBASE_API_KEY=demo-api-key
      - NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-eventpass.firebaseapp.com
      - NUXT_PUBLIC_FIREBASE_PROJECT_ID=demo-eventpass
      - NUXT_PUBLIC_FIREBASE_APP_ID=1:1234567890:web:abc123def456
    command: sh -c "npm install && npm run dev"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - FIRESTORE_EMULATOR_HOST=firebase-emulators:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulators:9099

  firebase-emulators:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "9099:9099"
      - "8080:8080"
      - "4000:4000"
    command: >
      sh -c "npm install -g firebase-tools && 
             firebase emulators:start --project demo-eventpass"